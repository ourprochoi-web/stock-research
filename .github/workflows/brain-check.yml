name: Brain contract check

# 2026-09-26: 로컬 pre-commit 훅은 core.hooksPath 를 설정한 클론에서만 돈다.
#   Lead 봇(ourprochoi-web PAT) · Actions 수집기 · 다른 세션의 커밋은 훅을 타지 않았고,
#   그 결과가 09-22~25 실측이다 — routing 35줄 전부 영어 claim · routed[] 는 intake 파일 경로 ·
#   theses.json 사흘간 무변화. 규칙은 CLAUDE.md 에 있었지만 아무도 거절하지 않았다.
#   이 워크플로는 <누가 썼든> AGENTS.md §3 계약을 같은 검사로 본다. 자동 수정은 하지 않는다
#   (봇 간 push 경쟁을 늘리지 않기 위해) — 빨간 상태와 로그만 남긴다.
on:
  push:
    branches: [main]
    paths:
      - "brain/**"
      - "intake/*.jsonl"
      - "AGENTS.md"
      - ".githooks/check_*.py"
  pull_request:
    paths:
      - "brain/**"
      - "intake/*.jsonl"
      - "AGENTS.md"
      - ".githooks/check_*.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: routing 계약 (차단)
        run: PYTHONIOENCODING=utf-8 python3 .githooks/check_routing.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 포인터·id 중복 (경고)
        if: always()
        run: PYTHONIOENCODING=utf-8 python3 .githooks/check_intake.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: facts ↔ 페이지 (경고)
        if: always()
        run: PYTHONIOENCODING=utf-8 python3 .githooks/check_facts.py | tee -a "$GITHUB_STEP_SUMMARY" || true
