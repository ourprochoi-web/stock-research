name: Collect Congress PTR (intake)

# 2026-09-20 사용자 결정 —「펠로시 같은 사람들 투자법은 중요하다」.
# 세션 샌드박스는 disclosures-clerk.house.gov 가 프록시 403 이라 여기서 받는다.
# 판단은 하지 않는다 — intake/files/congress/{연도}/{DocID}.pdf·txt 와 collected.jsonl 한 줄(routed:false).
# 트리거 셋: ① 평일 아침(KST) ② 수동 ③ intake/requests/congress_members.txt 를 고쳐 push
on:
  schedule:
    - cron: "0 22 * * 0-4"   # UTC 22:00 = KST 07:00 (월~금 아침)
  workflow_dispatch:
    inputs:
      year:
        description: "수집 연도 (비우면 올해)"
        required: false
        type: string
      all:
        description: "감시 목록 무시하고 전원"
        required: false
        type: boolean
  push:
    paths:
      - "intake/requests/congress_members.txt"

permissions:
  contents: write

concurrency:
  group: collect-congress
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pypdf
      - name: Fetch PTR
        run: python3 intake/collect_congress.py ${{ inputs.year }} --oge ${{ inputs.all && '--all' || '' }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          git add intake/collected.jsonl intake/files/congress
          git diff --cached --quiet && exit 0
          git commit -m "📥 intake: 하원 PTR ($(date +%Y-%m-%d))"
          git push
