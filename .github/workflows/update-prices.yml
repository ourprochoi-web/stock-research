name: Update Portfolio Prices

on:
  schedule:
    # 평일 장 마감 후 (KST 16:30 = UTC 07:30)
    - cron: '30 7 * * 1-5'
  workflow_dispatch: # 수동 실행 가능

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch latest prices
        run: python3 portfolio/data/update_prices.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet portfolio/data/prices.json && exit 0
          git add portfolio/data/prices.json
          git commit -m "Update portfolio prices ($(date +%Y-%m-%d))"
          git push
