name: Update Portfolio Prices

on:
  schedule:
    # 평일 장 마감 후 (KST 16:30 = UTC 07:30)
    - cron: '30 7 * * 1-5'
  workflow_dispatch: # 수동 실행 가능

# 2026-08-08: permissions 블록이 없어 기본 read-only 토큰으로 동작했고,
# git push 가 403 으로 실패해 2026-07-16 이후 한 번도 커밋되지 않았다.
# 출처(네이버 금융 API)도 스크립트도 정상이었고 고장난 것은 이 선언 하나였다.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch latest prices
        run: python3 portfolio/data/update_prices.py

      # 2026-09-13: 수집 층(intake/) 자동 수집 — 일일 브리핑·TSMC 월매출. 판단 없이 받아서 남긴다.
      # 실패해도 워크플로를 막지 않는다(실패 자체가 collected.jsonl 에 status 로 기록된다).
      - name: Collect intake (soonsal · TSMC)
        run: python3 intake/collect.py || true

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio/data/prices.json intake/collected.jsonl intake/files
          git diff --cached --quiet && exit 0
          git commit -m "Update prices · intake ($(date +%Y-%m-%d))"
          # 2026-09-20: main 에 동시 푸시가 흔해졌다(시세 봇 · 수집기 3종 · 세션 여럿).
          #   재시도 없이 push 하면 먼저 올린 쪽이 이기고 이쪽 수집분이 조용히 사라진다
          #   — 실제로 났다(collect-fetch run 35485990057: 수집 성공 · 커밋 성공 · push 거절 · 결과 소실).
          #   .gitattributes 의 merge=union 이 JSONL 의 append 충돌을 자동 해소한다(§H2).
          for i in 1 2 3 4 5; do
            git push && exit 0
            sleep $((i * 3))
            git pull --rebase --autostash origin main || exit 1
          done
          git push
